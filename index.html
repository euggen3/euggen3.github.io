<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eugene is somowhere here...</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0b0b0b;
            background-image: radial-gradient(#222 1px, transparent 1px);
            background-size: 20px 20px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .title {
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .subtitle-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: clamp(2rem, 5vw, 3.8rem);
            font-weight: 800;
            margin-top: 10px;
        }

        .subtitle-text {
            color: #888888;
        }

        .badge {
            background-color: #ffffff;
            color: #000000;
            padding: 2px 14px;
            border-radius: 6px;
            font-weight: 900;
            letter-spacing: -0.01em;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">А что вы тут хотели увидеть?</h1>
        <div class="subtitle-container">
            <span class="subtitle-text">Сайт еще</span>
            <span class="badge">RAW</span>
        </div>
    </div>
</body>
</html>
